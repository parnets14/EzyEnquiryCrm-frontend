[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  VITE_API_URL = "https://ezyenquiry-backend.onrender.com/api"

# SPA fallback — all routes serve index.html so React Router works on reload
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
